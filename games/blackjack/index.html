<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Just a Little Fun — Blackjack</title>
<meta name="theme-color" content="#1a2e5a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- JALF card renderer (cardmeister + themed wrapper). Loaded before the module
     so window.JALFCards is ready when the game script runs. -->
<script src="data/cardmeister.full.js"></script>
<script src="data/jalf-cards.js"></script>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --blue:#1a2e5a; --blue-lt:#243d7a; --blue-deep:#0d1c3a;
  --white:#fff; --offwhite:#f4f6fa; --line:#d8deea;
  --ink:#16203a; --ink-soft:#5b6478; --mid:#8a93a8; --dark:#111;
  --ok:#1e7d3a; --err:#c8102e; --gold:#c8961e;
}
html,body{ height:100%; }
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#fff; min-height:100dvh;
  display:flex; flex-direction:column;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(30,125,58,0.14) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 60%, rgba(26,46,90,0.28) 0%, transparent 60%),
    #0d1f12;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
.hidden{ display:none !important; }

/* nav (from skeleton) */
.nav-strip{ flex-shrink:0; background:var(--blue-deep); color:rgba(255,255,255,.6); padding:calc(4px + env(safe-area-inset-top)) 13px 4px; font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:.14em; text-transform:uppercase; display:flex; justify-content:space-between; }
.nav-strip b{ color:#fff; font-weight:600; }
/* top-right phase tag: green when a round is live, grey otherwise (horse page). */
.nav-strip #nav-phase{ color:var(--ok); font-weight:600; }
.nav-strip #nav-phase.muted{ color:rgba(255,255,255,.5); }
.nav-main{ flex-shrink:0; background:var(--blue); color:#fff; box-shadow:0 2px 12px rgba(0,0,0,.4); z-index:20; }
.nav-row1{ display:flex; align-items:center; gap:10px; padding:8px 12px; }
.nav-logo{ width:42px; height:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.nav-logo img{ max-width:100%; max-height:100%; object-fit:contain; display:block; }
.nav-logo .fallback{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:15px; letter-spacing:1px; color:var(--gold); }
.nav-bal{ flex:1; text-align:center; min-width:0; }
.nav-bal .lab{ display:block; font-family:'Oswald',sans-serif; font-size:9px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.55); line-height:1; }
.nav-bal .val{ display:block; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:23px; line-height:1.05; font-variant-numeric:tabular-nums; transition:color .45s ease; will-change:transform; }
/* balance change animation: number rolls to the new value tinted green (up) or
   red (down), pops on landing, then the tint fades back to white. */
.nav-bal .val.bal-up{ color:#3ddc6b; }
.nav-bal .val.bal-down{ color:#ff6b60; }
.nav-bal .val.bal-pop{ animation:balPop .22s ease; }
@keyframes balPop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.22); } 100%{ transform:scale(1); } }
@media (prefers-reduced-motion:reduce){ .nav-bal .val.bal-pop{ animation:none; } }
.nav-ctrl{ flex-shrink:0; display:flex; }

.nav-row2{ display:flex; align-items:stretch; border-top:1px solid rgba(255,255,255,.14); }
.nav-screen{ flex:1; padding:7px 12px; min-width:0; display:flex; flex-direction:column; justify-content:center; }
.nav-screen .sn{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:17px; line-height:1.05; text-transform:uppercase; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav-screen .sc{ font-family:'Oswald',sans-serif; font-weight:500; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.55); line-height:1.3; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav-clock{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 14px; border-left:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.18); }
.nav-clock .lab{ font-family:'Oswald',sans-serif; font-size:8px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); }
.nav-clock .val{ display:block; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:26px; line-height:1; font-variant-numeric:tabular-nums; }
.nav-clock.urgent .val{ color:#ff3b30; }
.leave-ctrl{ font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; background:transparent; color:rgba(255,255,255,.8); border:1.5px solid rgba(255,255,255,.35); border-radius:7px; padding:7px 12px; }
.leave-ctrl.confirm{ color:#fff; border-color:var(--err); background:rgba(200,16,46,.25); }
/* top-right segmented control: MY HANDS button (replaces Leave once seated) */
.seg{ display:flex; border-radius:7px; overflow:hidden; border:1px solid rgba(255,255,255,.25); }
.seg button{ font-family:'Oswald',sans-serif; font-weight:600; font-size:10px; letter-spacing:.04em; text-transform:uppercase; padding:8px 10px; border:none; cursor:pointer; background:rgba(255,255,255,.06); color:#fff; display:flex; align-items:center; gap:4px; }
.seg button.active{ background:#fff; color:var(--blue); }
.seg button.pulse{ animation:segpulse 1s ease-in-out 3; }
@keyframes segpulse{ 0%,100%{ background:rgba(255,255,255,.06); color:#fff; } 50%{ background:#3fd0c9; color:#04231f; } }
@media (prefers-reduced-motion:reduce){ .seg button.pulse{ animation:none; } }

/* gates */
.gate{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:40px 24px; text-align:center; }
.gate .g-title{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:32px; text-transform:uppercase; }
.gate .g-text{ font-size:15px; color:rgba(255,255,255,.7); max-width:320px; line-height:1.5; }
.gate .g-btn{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:18px; text-transform:uppercase; border:none; border-radius:10px; padding:12px 26px; color:#fff; background:var(--blue); box-shadow:0 4px 0 var(--blue-deep); cursor:pointer; }
.spinner{ width:34px; height:34px; border:3px solid rgba(255,255,255,.2); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

#home{ flex:1; display:flex; flex-direction:column; min-height:0; }
/* Scroll panes are flex:1 children of the column #home. They MUST also carry
   min-height:0 — without it a flex item's implicit min-height:auto refuses to
   shrink below its content, so an overflowing pane grows past the viewport and
   its bottom (and any ::after spacer) is pushed off-screen. This is the real
   cause of the recurring "last item cut off" bug; min-height:0 lets flex:1
   constrain the pane so overflow-y:auto can actually scroll it. The ::after adds
   comfortable breathing room at the scroll end (incl. the safe-area inset). */
#stage{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
#stage::after{ content:""; display:block; flex-shrink:0; height:calc(40px + env(safe-area-inset-bottom)); }

/* waiting card */
.wait{ margin:auto; text-align:center; max-width:320px; }
.wait .wt{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:28px; text-transform:uppercase; }
.wait .wx{ font-size:14px; color:rgba(255,255,255,.65); margin-top:8px; line-height:1.5; }

/* your hand. flex-shrink:0 for the same reason as .rules — keep full height in
   the flex-column #stage so a tall (split) hand set scrolls rather than clips. */
.myhand{ display:flex; flex-direction:column; gap:16px; flex-shrink:0; }
.hand-block{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:14px; }
.hand-block.active{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(200,150,30,.3); }
.hand-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.7); }
.hand-cards{ display:flex; gap:8px; flex-wrap:wrap; }
.card{ width:58px; height:82px; border-radius:7px; background:#fff; color:#111; box-shadow:0 3px 8px rgba(0,0,0,0.4); display:flex; flex-direction:column; justify-content:space-between; padding:6px 7px; font-weight:800; }
.card .r{ font-size:1.2rem; line-height:1; } .card .s{ font-size:1.3rem; align-self:flex-end; }
.card.red{ color:#c8102e; }
.tot{ font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; }
.tot .pill{ padding:2px 10px; border-radius:12px; background:rgba(255,255,255,0.15); margin-left:6px; }
.tot .pill.bust{ background:var(--err); } .tot .pill.bj{ background:var(--gold); color:#000; }

/* action buttons — colours mirror the HOST play-by-play text scheme
   (HIT #fff, STAND teal #3fd0c9, DOUBLE amber #ff9d3d, SPLIT blue #4a90ff),
   here as button fills with contrast-appropriate ink and a matching bottom edge. */
.actions{ margin-top:auto; padding-top:16px; }
.action-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.act{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:20px; letter-spacing:.05em; text-transform:uppercase; border:none; border-radius:12px; padding:16px; color:#fff; background:var(--blue); box-shadow:0 4px 0 var(--blue-deep); cursor:pointer; }
.act:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--blue-deep); }
.act:disabled{ opacity:.35; box-shadow:0 4px 0 var(--blue-deep); }
.act.hit{ background:#ffffff; color:#16203a; box-shadow:0 4px 0 #c2c8d4; }
.act.stand{ background:#3fd0c9; color:#0a2e2c; box-shadow:0 4px 0 #1f8a85; }
.act.dbl{ background:#ff9d3d; color:#3a1e00; box-shadow:0 4px 0 #c26a12; }
.act.split{ background:#4a90ff; color:#04173d; box-shadow:0 4px 0 #2560c2; }
.act.hit:disabled,.act.stand:disabled,.act.dbl:disabled,.act.split:disabled{ opacity:.35; }
.msg{ min-height:16px; margin-top:10px; font-size:13px; text-align:center; }
.msg.err{ color:#ff6b60; font-weight:700; } .msg.ok{ color:#7ddc93; font-weight:700; }

/* stake pad — visual style matched to the horse player pad */
.pad{ margin-top:auto; background:#fff; color:var(--ink); border-radius:14px; padding:14px 16px 16px; box-shadow:0 -2px 16px rgba(0,0,0,.35); }
.pad-lab{ text-align:center; font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--mid); }
.pad-amt{ text-align:center; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:52px; line-height:1; color:var(--blue); font-variant-numeric:tabular-nums; margin-top:2px; }
.pad-amt .c{ font-size:26px; vertical-align:super; color:var(--mid); }
.pad-quick{ display:flex; gap:8px; justify-content:center; margin:12px 0; }
.pad-quick button{ font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; padding:8px 14px; border-radius:20px; border:1.5px solid var(--line); background:var(--offwhite); color:var(--ink); cursor:pointer; }
.pad-quick button:active{ background:var(--line); }
.pad-keys{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.pad-keys button{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px; padding:12px 0; border:none; border-radius:8px; background:var(--offwhite); color:var(--ink); cursor:pointer; }
.pad-keys button:active{ background:var(--line); }
.pad-place{ width:100%; margin-top:12px; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:24px; text-transform:uppercase; letter-spacing:.06em; border:none; border-radius:8px; padding:14px; color:#fff; background:var(--blue); box-shadow:0 4px 0 var(--blue-deep); cursor:pointer; }
.pad-place:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--blue-deep); }
.pad-place:disabled{ opacity:.5; box-shadow:0 4px 0 var(--blue-deep); }
.pad-place.confirm{ background:var(--ok); box-shadow:0 4px 0 #145226; }
.pad-place.confirm:active{ box-shadow:0 1px 0 #145226; }
.pad .msg{ color:var(--ink-soft); }
.pad .msg.err{ color:var(--err); } .pad .msg.ok{ color:var(--ok); }

/* you're up takeover */
#takeover{ position:fixed; inset:0; z-index:100; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:linear-gradient(160deg,var(--gold),#a97c12); animation:flash .5s ease; }
#takeover.on{ display:flex; }
#takeover .big{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:64px; color:#111; text-transform:uppercase; letter-spacing:2px; }
#takeover .sub{ font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:.2em; text-transform:uppercase; color:rgba(0,0,0,.6); }
@keyframes flash{ from{ opacity:0; transform:scale(.9); } to{ opacity:1; transform:scale(1); } }

/* My Bets */
.tab-bar{ flex-shrink:0; display:flex; background:var(--blue-deep); }
.tab{ flex:1; text-align:center; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.1em; text-transform:uppercase; padding:10px; color:rgba(255,255,255,.55); cursor:pointer; }
.tab.on{ color:#fff; box-shadow:inset 0 -2px 0 #fff; }
#mybets{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px calc(20px + env(safe-area-inset-bottom)); }
#mybets::after{ content:""; display:block; flex-shrink:0; height:calc(40px + env(safe-area-inset-bottom)); }
#finale{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px calc(20px + env(safe-area-inset-bottom)); }
#finale::after{ content:""; display:block; flex-shrink:0; height:calc(40px + env(safe-area-inset-bottom)); }
#table{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px calc(20px + env(safe-area-inset-bottom)); }
#table::after{ content:""; display:block; flex-shrink:0; height:calc(40px + env(safe-area-inset-bottom)); }
/* A scroll container drops its last child's bottom margin from the scrollable
   extent, so a trailing .mb-round / row gets clipped even with padding. Zero it
   on the direct last child of every pane (the ::after spacer then provides the
   real breathing room). This is what the roulette page does and is the piece the
   blackjack panes were missing. */
#stage > :last-child, #table > :last-child,
#mybets > :last-child, #finale > :last-child{ margin-bottom:0; }

/* TABLE view — dealer hand up top, then every seat below */
.tbl-block{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
.tbl-block.dealer{ border-color:rgba(200,150,30,.5); background:linear-gradient(135deg,rgba(200,150,30,.16),rgba(255,255,255,.04)); }
.tbl-block.active{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(200,150,30,.3); }
.tbl-block.me{ box-shadow:0 0 0 2px rgba(63,208,201,.5); }
.tbl-head{ display:flex; justify-content:space-between; align-items:center; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.75); }
.tbl-head .tag{ font-family:'Oswald',sans-serif; font-weight:600; font-size:9px; letter-spacing:.1em; background:#3fd0c9; color:#04231f; border-radius:5px; padding:2px 6px; margin-left:8px; }
.tbl-head .st{ font-size:11px; color:rgba(255,255,255,.5); }
.tbl-cards{ display:flex; gap:6px; flex-wrap:wrap; margin:9px 0 4px; }
.tbl-tot{ font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:rgba(255,255,255,.8); }
.tbl-tot .pill{ padding:2px 9px; border-radius:11px; background:rgba(255,255,255,0.15); margin-left:6px; }
.tbl-tot .pill.bust{ background:var(--err); } .tbl-tot .pill.bj{ background:var(--gold); color:#000; }
/* face-down hole card */
.card-back{ width:58px; height:82px; border-radius:7px; box-shadow:0 3px 8px rgba(0,0,0,0.4);
  background:repeating-linear-gradient(45deg,var(--blue) 0 6px,var(--blue-lt) 6px 12px); border:2px solid rgba(255,255,255,.5); }
.tbl-sub{ font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.45); margin:2px 0 8px; }
.bet-row{ display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); border-radius:10px; padding:12px 14px; margin-bottom:8px; }
.bet-row .br-l{ font-family:'Oswald',sans-serif; font-size:13px; }
.bet-row .br-l small{ display:block; color:rgba(255,255,255,.5); font-size:11px; }
.bet-row .br-r{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:20px; }
.br-r.pos{ color:#7ddc93; } .br-r.neg{ color:#ff6b60; } .br-r.zero{ color:rgba(255,255,255,.6); }

/* lobby rules viewer. flex-shrink:0 so the flex-column #stage can't compress the
   list below its natural height — the pane scrolls around it instead of clipping
   the tail. */
.rules{ display:flex; flex-direction:column; gap:10px; flex-shrink:0; }
.rules-head{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:22px; text-transform:uppercase; letter-spacing:.02em; margin-bottom:2px; }
.rule-tile{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:13px 15px; }
.rule-tile .rt-t{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:17px; text-transform:uppercase; letter-spacing:.03em; color:#fff; }
.rule-tile .rt-d{ font-size:13.5px; line-height:1.5; color:rgba(255,255,255,.72); margin-top:4px; }
.rule-foot{ text-align:center; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.45); padding:10px 0 4px; }

/* revamped My Bets — grouped rounds with real cards */
.mb-round{ margin-bottom:16px; }
.mb-round-h{ font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:6px; }
.mb-hand{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
.mb-h-top{ display:flex; justify-content:space-between; align-items:center; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.7); }
.mb-h-top .br-r{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:19px; }
.mb-cards{ display:flex; gap:5px; flex-wrap:wrap; margin:9px 0 6px; }
.mb-status{ font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.5); }
/* dealer's hand shown alongside my hands in the My Hands history, so a win/loss
   reads in context. Gold-tinted to match the TABLE view's dealer block. */
.mb-dealer{ background:linear-gradient(135deg,rgba(200,150,30,.14),rgba(255,255,255,.03));
  border:1px solid rgba(200,150,30,.4); border-radius:12px; padding:10px 14px; margin-bottom:8px; }
.mb-dealer .mb-h-top{ color:rgba(255,255,255,.8); }
.mb-dealer .mb-h-top .mb-h-lab{ color:var(--gold); }

/* finale: nav-level tab bar (Leaderboard / Big Moments) — a fixed bar under the
   nav, mirroring the horse finale, NOT tabs inside the scroll body. */
.fin-tabs{ flex-shrink:0; display:flex; align-items:stretch; background:var(--blue);
  border-top:1px solid rgba(255,255,255,.14); box-shadow:0 2px 12px rgba(0,0,0,.4); z-index:19; }
.fin-tab{ flex:1 1 0; min-width:0; text-align:center; padding:11px 4px; cursor:pointer;
  font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; color:rgba(255,255,255,.6); background:transparent; border:none;
  border-bottom:3px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fin-tab.active{ color:#fff; border-bottom-color:#fff; }
/* while My Hands is showing, neither nav tab is underlined */
.fin-tabs.noselect .fin-tab{ border-bottom-color:transparent; color:rgba(255,255,255,.6); }
/* placement hero — shown at the top of the Leaderboard tab (mirrors the horse
   finale's fin-hero, but in the blackjack dark/transparent idiom rather than the
   horse's light panel). */
.fin-hero{ flex-shrink:0; text-align:center; padding:16px 14px 14px; margin-bottom:12px;
  background:linear-gradient(160deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 100%);
  border:1px solid rgba(255,255,255,.1); border-radius:14px; }
.fin-hero .eyebrow{ font-family:'Oswald',sans-serif; font-size:9px; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.5); }
.fin-hero .medal{ font-size:44px; line-height:1; margin:6px 0 2px; }
.fin-hero .place{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:52px; line-height:.9; color:#fff; }
.fin-hero.gold .place{ color:var(--gold); }
.fin-hero .of{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-top:2px; }
.fin-hero .headline{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:22px; text-transform:uppercase; color:#fff; margin-top:10px; }

<body>

<section id="gate-loading" class="gate"><div class="spinner"></div><div class="g-text">Finding your seat…</div></section>
<section id="gate-error" class="gate hidden">
  <div class="g-title" id="err-title">Something went wrong</div>
  <div class="g-text" id="err-text"></div>
  <button class="g-btn" onclick="location.href='../../index.html'">Back to join</button>
</section>
<section id="gate-closed" class="gate hidden">
  <div class="g-title">Game over</div>
  <div class="g-text">The host closed the table. Thanks for playing.</div>
  <button class="g-btn" onclick="location.href='../../index.html'">Back to join</button>
</section>

<div id="home" class="hidden">
  <div class="nav-strip"><span>Playing as <b id="nav-name">—</b></span><span id="nav-phase">—</span></div>
  <div class="nav-main">
    <div class="nav-row1">
      <span class="nav-logo"><img id="nav-logo-img" src="./assets/jalf_logo.png" alt="JALF"
            onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback" style="display:none">JALF</span></span>
      <span class="nav-bal"><span class="lab">Balance</span><span class="val" id="nav-balance">$0</span></span>
      <span class="nav-ctrl" id="nav-ctrl"><button class="leave-ctrl" id="leave-btn">Leave</button></span>
    </div>
    <div class="nav-row2">
      <div class="nav-screen">
        <div class="sn" id="nav-title">—</div>
        <div class="sc" id="nav-sub">—</div>
      </div>
      <div class="nav-clock" id="nav-clock"><span class="lab" id="clock-lab">Closes</span><span class="val" id="clock-val">—</span></div>
    </div>
  </div>

  <!-- finale nav-level tabs (Leaderboard / Big Moments) — shown only when the
       game is finished; mirrors the horse finale's fixed tab bar. -->
  <div class="fin-tabs hidden" id="fin-tabs">
    <span class="fin-tab active" data-ft="board">Leaderboard</span>
    <span class="fin-tab" data-ft="moments">Big Moments</span>
  </div>

  <div class="tab-bar" id="tab-bar"></div>

  <div id="stage"></div>
  <div id="table" class="hidden"></div>
  <div id="mybets" class="hidden"></div>
  <div id="finale" class="hidden"></div>
</div>

<div id="takeover"><div class="big">You're up</div><div class="sub">Play your hand</div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://lhzxsjjgsvlnlixygjif.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxoenhzampnc3ZsbmxpeHlnamlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2MjI4MjIsImV4cCI6MjA5ODE5ODgyMn0.-AyZ1kr3iNwk7iAyPhGlqmHXvASBYWBtPSiROP6pSsQ';
const sb=createClient(SUPABASE_URL,SUPABASE_ANON);
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SUITS={S:['♠','black'],H:['♥','red'],D:['♦','red'],C:['♣','black']};

let roomCode=null,playerId=null,sessionId=null,player=null,session=null;
let channel=null,poll=null,lastStatus=null,mySeat=null,myStake=0,busy=false,wasMyTurn=false;
let PHRASES=null;                 // ./data/phrases.json — placement copy etc. (optional, editable without code)

/* ── card + total (JALFCards renderer; same math as host) ── */
const ALL_THEMES = JALFCards.themeNames();
/* Apply whatever theme the session config specifies. The host writes
   config.activeTheme each round when the mode is 'random', so following that
   (falling back to config.cardTheme, then a default) keeps the phone's deck in
   sync with the TV. */
function applySessionTheme(cfg){
  if(!cfg) return;
  const name = cfg.activeTheme || cfg.cardTheme;
  if(name && ALL_THEMES.includes(name)) JALFCards.setTheme(name);
}
function cardEl(code, size){
  const wrap=document.createElement('div');
  wrap.style.width = size==='sm' ? '38px' : '58px'; wrap.style.display='inline-block';
  const el=JALFCards.renderCard(code[0], code[1]);
  el.style.width='100%'; wrap.appendChild(el);
  return wrap;
}
function total(cards){ let t=0,a=0; for(const c of cards){const r=c[0]; if(r==='A'){t+=11;a++;} else if('TJQK'.includes(r))t+=10; else t+=parseInt(r,10);} while(t>21&&a>0){t-=10;a--;} return t; }

/* ── boot ── */
async function boot(){
  const p=new URLSearchParams(location.search);
  roomCode=(p.get('code')||'').trim().toUpperCase(); playerId=(p.get('pid')||'').trim();
  if(!roomCode||!playerId){ return showErr('We lost your ticket','This link is missing its room code or player. Head back and join again.'); }
  const {data:pl,error:pe}=await sb.from('players').select('id,session_id,display_name,balance').eq('id',playerId).single();
  if(pe||!pl){ return showErr('We lost your ticket','We couldn’t find your player. Head back and join again.'); }
  player=pl; sessionId=pl.session_id;
  const {data:se,error:se2}=await sb.from('sessions').select('id,room_code,status,config,current_seat,turn_phase,deadline,deadline_kind,current_round').eq('id',sessionId).single();
  if(se2||!se){ return showErr('Game not found','This table has closed. Head back and join again.'); }
  session=se;
  // optional editable copy (placement headlines etc.); safe to be absent
  try{ const r=await fetch('./data/phrases.json'); if(r.ok) PHRASES=await r.json(); }catch(e){}
  $('nav-name').textContent=player.display_name; setBalance(player.balance); showHome();
  await resolveMySeat();
  applyState(session); subscribe();
}

/* my seat_index comes from my hand this round (once I've bet) */
async function resolveMySeat(){
  const {data}=await sb.from('hands').select('seat_index').eq('session_id',sessionId)
    .eq('round_number',session.current_round ?? 0).eq('player_id',playerId).limit(1);
  mySeat = data&&data.length ? data[0].seat_index : null;
}

/* ── realtime ── */
function subscribe(){
  channel=sb.channel('bjp-'+playerId)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'players',filter:'id=eq.'+playerId},p=>{ if(p.new) setBalance(p.new.balance); })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'sessions',filter:'id=eq.'+sessionId},p=>{ if(p.new){ session={...session,...p.new}; applyState(p.new); } })
    .on('postgres_changes',{event:'*',schema:'public',table:'hands',filter:'player_id=eq.'+playerId},()=>{ if(currentTab==='play') repaintPlay(); else if(currentTab==='table') renderTable(); else renderMyBets(); })
    .subscribe();
  if(poll)clearInterval(poll);
  poll=setInterval(async()=>{ if(document.hidden)return;
    const {data}=await sb.from('sessions').select('status,current_seat,turn_phase,deadline,deadline_kind,current_round,config').eq('id',sessionId).single();
    if(data){ session={...session,...data}; applyState(data); } },3000);
}

/* ── config (synced from host) ── */
let cfg={ numRounds:5, startingBalance:200, numDecks:6, shoeMode:'fresh', cardTheme:'random' };
function readConfig(c){ if(c&&typeof c==='object'){ cfg={...cfg,...c}; } return cfg; }
function configLine(){
  const shoe = cfg.shoeMode==='continuous' ? 'continuous shoe' : 'fresh shoe';
  return `${cfg.numRounds} rounds · ${cfg.numDecks} decks · ${shoe} · $${cfg.startingBalance} bank`;
}

/* ── clock ──
   Mirrors the horse player page. Counts down to the active deadline while a
   round is live; the moment bets close (everyone's in, or the 30s window has
   elapsed) it shows the literal word "Closed" instead of a stale countdown. */
let clockTimer=null, betsClosedShown=false;
function runClock(deadlineIso){
  stopClock(); const box=$('nav-clock'),val=$('clock-val'),lab=$('clock-lab');
  lab.textContent='Closes';
  const dl=new Date(deadlineIso).getTime();
  const tick=()=>{ let s=Math.round((dl-Date.now())/1000);
    if(s<=0){ val.textContent='—'; box.classList.remove('urgent'); return; }
    val.textContent=`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; box.classList.toggle('urgent',s<=10); };
  tick(); clockTimer=setInterval(tick,250);
}
function stopClock(){ if(clockTimer){clearInterval(clockTimer);clockTimer=null;}
  const box=$('nav-clock'); box.classList.remove('urgent');
  $('clock-lab').textContent='Closes'; $('clock-val').textContent='—'; }
function showClosedClock(){ stopClock(); $('clock-lab').textContent='Bets'; $('clock-val').textContent='Closed'; }

/* ── phase strip (top-right) + banner title/subtitle ──
   Drives all three synced text zones from the current session status:
   • #nav-phase  : green LIVE ROUND x OF n / DEALING / <NAME>'S TURN / SETTLING,
                   grey WAITING TO START / THAT'S THE TABLE.
   • #nav-title  : the big banner word (WAITING TO START / BETTING / PLAYING / …).
   • #nav-sub    : config line in lobby, "x players this round" while live, etc. */
let liveTurnName='';            // name for "<NAME>'S TURN" (or 'Dealer')
async function setHeader(){
  const s=session, status=s.status, round=(s.current_round ?? 0), n=cfg.numRounds;
  const ph=$('nav-phase'), title=$('nav-title'), sub=$('nav-sub');
  const green=t=>{ ph.textContent=t; ph.classList.remove('muted'); };
  const grey =t=>{ ph.textContent=t; ph.classList.add('muted'); };

  if(status==='lobby'){
    grey('Waiting to start'); title.textContent='Waiting to start'; sub.textContent=configLine(); return;
  }
  if(status==='finished'){
    grey("That's the table"); title.textContent="That's the table";
    sub.textContent=`${n} rounds played · final results in`; return;
  }
  // one continuous banner title from first bet to the final hand — the green
  // phase tag (top-right) carries the actual step of the flow, so the big title
  // stays put and never flips between betting and playing.
  title.textContent='At the table';
  const roundTag=`Round ${round + 1} of ${n}`;
  if(status==='betting'){
    const players=await betCounts(round);
    sub.textContent=`${players.bets} player${players.bets===1?'':'s'} this round`;
    if(betsClosedShown){ green(`Bets closed · ${roundTag}`); }
    else green(`Live · ${roundTag}`);
    return;
  }
  // Play phase — confirmed backend flow:
  //   'dealing'       : cards just dealt, no seat active yet  → DEALING
  //   'between_turns' : a seat (or the dealer) is up          → <NAME>'S / DEALER'S TURN
  //   'recap'         : the round is over, results in         → SETTLING
  // The dealer's turn is signalled by current_seat = -1 (its hand sits at
  // seat_index 999). Any other non-null current_seat is a player seat.
  const players=await betCounts(round);
  sub.textContent=`${players.bets} player${players.bets===1?'':'s'} this round`;
  if(status==='recap'||status==='settling'){ green(`Settling · ${roundTag}`); return; }
  if(status==='between_turns' && s.current_seat!=null){
    if(s.current_seat===-1){ green(`Dealer's turn · ${roundTag}`); return; }
    if(liveTurnName){ green(`${liveTurnName==='You' ? 'Your turn' : `${liveTurnName}'s turn`} · ${roundTag}`); return; }
  }
  // 'dealing', or between_turns before a seat is set → cards being dealt
  green(`Dealing · ${roundTag}`);
}
async function betCounts(round){
  const {data:hands}=await sb.from('hands').select('player_id,seat_index,is_dealer')
    .eq('session_id',sessionId).eq('round_number',round);
  const bettors=new Set((hands||[]).filter(h=>!h.is_dealer).map(h=>h.player_id));
  return { bets:bettors.size, hands:hands||[] };
}
/* resolve the acting seat's display name for "<NAME>'S TURN".
   Dealer is current_seat = -1 (the host's sentinel); its hand row is seat 999. */
async function resolveTurnName(s){
  if(s.current_seat==null){ liveTurnName=''; return; }
  if(s.current_seat===-1){ liveTurnName='Dealer'; return; }
  const round=s.current_round ?? 0;
  const {data}=await sb.from('hands').select('player_id,is_dealer')
    .eq('session_id',sessionId).eq('round_number',round)
    .eq('seat_index',s.current_seat).limit(1);
  if(data&&data.length&&data[0].is_dealer){ liveTurnName='Dealer'; return; }
  if(data&&data.length){
    const pid=data[0].player_id;
    if(pid===playerId){ liveTurnName='You'; return; }
    const {data:pl}=await sb.from('players').select('display_name').eq('id',pid).single();
    liveTurnName=(pl&&pl.display_name)||'Player';
  } else liveTurnName='';
}

/* ── state router ── */
async function applyState(s){
  const status=s.status;
  readConfig(session.config);
  applySessionTheme(session);   // keep the deck in sync

  // bets-closed detection (mirror host): flip to Closed the instant everyone has
  // bet OR the betting deadline has elapsed; stays closed until the round moves on.
  if(status==='betting'){
    if(!betsClosedShown){
      const overDeadline = s.deadline && (new Date(s.deadline).getTime() - Date.now() <= 0);
      let everyoneIn=false;
      const {data:players}=await sb.from('players').select('id').eq('session_id',sessionId);
      const {bets}=await betCounts(s.current_round ?? 0);
      everyoneIn = players && players.length>0 && bets>=players.length;
      if(overDeadline||everyoneIn) betsClosedShown=true;
    }
  } else { betsClosedShown=false; }

  // clock: countdown while betting is genuinely open; "Closed" once bets shut;
  // countdown during turn/next-round deadlines; em dash otherwise.
  // Note: deal_blackjack_round sets status='dealing' but leaves the now-expired
  // bet_close deadline in place, so we must NOT treat bet_close as live outside
  // the betting phase (or 'dealing' would show a frozen 0:00).
  if(status==='betting'){
    if(betsClosedShown) showClosedClock();
    else if(s.deadline) runClock(s.deadline);
    else stopClock();
  } else if(s.deadline && ['turn_start','action_timeout','next_round'].includes(s.deadline_kind)){
    runClock(s.deadline);
  } else stopClock();

  await resolveTurnName(s);
  await setHeader();

  // The TABLE pane only exists during a live round — if we're on it when the
  // table drops to lobby or reaches the finale, fall back to the primary view.
  if(currentTab==='table' && (status==='lobby'||status==='finished')) currentTab='play';
  // When the game finishes, land on the finale (Leaderboard) unless the player
  // is already looking at their My Hands history.
  if(status==='finished' && currentTab!=='bets') currentTab='finale';
  // Leaving the finished state (e.g. AGAIN reopens a live round) drops us back to
  // the primary play view.
  if(status!=='finished' && currentTab==='finale') currentTab='play';
  // a new game (host AGAIN) leaves the finished state — allow the finale to
  // rebuild + re-animate next time it's shown.
  if(status!=='finished' && _finaleBuilt){ _finaleBuilt=false; finTab='board'; }

  // keep the pane visibility + fin-tabs bar in sync with the resolved tab
  $('stage').classList.toggle('hidden', currentTab!=='play');
  $('table').classList.toggle('hidden', currentTab!=='table');
  $('mybets').classList.toggle('hidden', currentTab!=='bets');
  $('finale').classList.toggle('hidden', currentTab!=='finale');
  $('fin-tabs').classList.toggle('hidden', !(status==='finished' && currentTab==='finale'));

  renderTabBar(); renderNavCtrl();

  if(currentTab==='play') await repaintPlay();
  else if(currentTab==='table') await renderTable();
  else if(currentTab==='bets') await renderMyBets();
  else if(currentTab==='finale') await renderFinale();

  // you're-up detection: my seat is current + acting
  const myTurn = (status==='between_turns'||status==='dealing') && s.current_seat===mySeat && mySeat!=null;
  const acting = s.turn_phase==='acting' && s.current_seat===mySeat && mySeat!=null;
  if((myTurn||acting) && !wasMyTurn){ wasMyTurn=true; fireTakeover(); }
  if(!(myTurn||acting)) wasMyTurn=false;

  if(status==='finished'){ if(s.config&&s.config.closed_by_host) return showClosed(); }
}

/* ── PLAY tab paint ── */
let currentTab='play';
async function repaintPlay(){
  const stage=$('stage'); if(currentTab!=='play')return;
  const status=session.status, round=session.current_round ?? 0;

  // lobby → rules viewer (something to read while waiting)
  if(status==='lobby'){ renderLobbyRules(stage); return; }
  // finished is handled by the dedicated #finale pane (see renderFinale), not here.

  // betting → stake pad (unless I already bet, or the window has closed)
  if(status==='betting'){
    await resolveMySeat();
    if(mySeat!=null){ stage.innerHTML=`<div class="wait"><div class="wt">Bet placed</div><div class="wx">Waiting for the deal…</div></div>`; return; }
    // window closed (timer up or all players in) and I have no bet → I've missed
    // it: hide the pad and show the sitting-out message rather than a live pad.
    if(betsClosedShown){ stage.innerHTML=`<div class="wait"><div class="wt">Sitting out this round</div><div class="wx">Betting closed before your bet was in — back next hand.</div></div>`; return; }
    // No funds → can't bet. Show a clear sat-out state instead of a dead pad, and
    // (crucially) the host no longer waits on broke players, so the table won't
    // stall on you — the round deals as soon as everyone with money is in.
    if((Number(player.balance)||0)<=0){ stage.innerHTML=`<div class="wait"><div class="wt">Out of chips</div><div class="wx">No balance left to bet — sitting out. The table won’t wait on you.</div></div>`; return; }
    renderPad(stage); return;
  }

  // fetch my hands this round
  const {data:mine}=await sb.from('hands').select('*').eq('session_id',sessionId).eq('round_number',round).eq('player_id',playerId).order('hand_index');
  if(!mine||!mine.length){ stage.innerHTML=`<div class="wait"><div class="wt">Sitting this one out</div><div class="wx">You didn’t bet this round — back next hand.</div></div>`; return; }

  // Apply this round's deck theme from the freshest config before drawing any
  // card. The host commits config.activeTheme before dealing; reading it here
  // (rather than trusting a possibly-stale realtime payload) keeps the phone's
  // deck identical to the TV.
  const {data:freshCfg}=await sb.from('sessions').select('config').eq('id',sessionId).single();
  if(freshCfg&&freshCfg.config){ session.config=freshCfg.config; readConfig(freshCfg.config); applySessionTheme(freshCfg.config); }


  const isMyTurn = session.turn_phase==='acting' && session.current_seat===mySeat;
  renderMyHands(stage, mine, isMyTurn);
}

/* ── TABLE pane paint ──
   Dealer's hand up top (first card face-up, the hole shown face-down until the
   dealer's turn reveals it), then every seat this round below. Your own seat is
   labelled "You". Seats are ordered by seat_index so the layout matches the TV. */
async function renderTable(){
  const box=$('table'); if(currentTab!=='table') return;
  const status=session.status, round=session.current_round ?? 0;
  const {data:hands}=await sb.from('hands').select('*')
    .eq('session_id',sessionId).eq('round_number',round).order('seat_index');
  if(!hands||!hands.length){
    box.innerHTML=`<div class="wait" style="margin-top:40px"><div class="wx">No hands on the table yet.</div></div>`; return;
  }
  // keep the deck theme in sync before drawing any real card
  const {data:freshCfg}=await sb.from('sessions').select('config').eq('id',sessionId).single();
  if(freshCfg&&freshCfg.config){ session.config=freshCfg.config; readConfig(freshCfg.config); applySessionTheme(freshCfg.config); }

  const dealer=hands.find(h=>h.is_dealer);
  const seats=hands.filter(h=>!h.is_dealer);
  // names for every seat's owner
  const ids=[...new Set(seats.map(h=>h.player_id))];
  const names={};
  if(ids.length){
    const {data:pl}=await sb.from('players').select('id,display_name').in('id',ids);
    (pl||[]).forEach(p=>names[p.id]=p.display_name);
  }
  // the dealer reveals the hole card once it's the dealer's turn or the round settles
  const dealerRevealed = (status==='recap'||status==='settling') ||
    (session.current_seat===-1) ||
    (dealer && dealer.status && dealer.status!=='playing' && dealer.status!=='dealt');

  let html='';
  if(dealer){
    const revealCards = dealerRevealed ? dealer.cards : dealer.cards.slice(0,1);
    const t = dealerRevealed ? total(dealer.cards) : total(revealCards);
    const pill = dealerRevealed
      ? (dealer.status==='bust'?`<span class="pill bust">Bust</span>`:dealer.status==='blackjack'?`<span class="pill bj">Blackjack</span>`:`<span class="pill">${t}</span>`)
      : `<span class="pill">${t}+</span>`;
    const activeDealer = session.current_seat===-1 ? ' active' : '';
    html+=`<div class="tbl-block dealer${activeDealer}">
      <div class="tbl-head"><span>Dealer</span><span class="st">${dealerRevealed?esc(dealer.status||''):'Hole down'}</span></div>
      <div class="tbl-cards" id="td-cards"></div>
      <div class="tbl-tot">Showing <span class="pill">${t}${dealerRevealed?'':'+'}</span></div></div>`;
  }
  html+='<div class="tbl-sub">Players this round</div>';
  html+=seats.map((h,i)=>{
    const me=h.player_id===playerId;
    const nm=me?'You':(names[h.player_id]||'Player');
    const t=total(h.cards);
    const pill=h.status==='bust'?`<span class="pill bust">Bust</span>`:h.status==='blackjack'?`<span class="pill bj">Blackjack</span>`:`<span class="pill">${t}</span>`;
    const active = session.current_seat===h.seat_index ? ' active' : '';
    const multi = seats.filter(x=>x.player_id===h.player_id).length>1;
    const label = multi ? `${nm} · Hand ${h.hand_index+1}` : nm;
    return `<div class="tbl-block${active}${me?' me':''}">
      <div class="tbl-head"><span>${esc(label)}${me?'<span class="tag">You</span>':''}</span><span class="st">$${h.stake} · ${esc(h.status||'')}</span></div>
      <div class="tbl-cards" data-seat="${i}"></div>
      <div class="tbl-tot">Total ${pill}</div></div>`;
  }).join('');
  box.innerHTML=html;

  // draw real cards: dealer (with a face-down back for the hole when hidden)
  if(dealer){
    const strip=$('td-cards');
    if(strip){
      const show = dealerRevealed ? dealer.cards : dealer.cards.slice(0,1);
      show.forEach(cd=>strip.appendChild(cardEl(cd)));
      if(!dealerRevealed){ for(let k=1;k<dealer.cards.length;k++){ const b=document.createElement('div'); b.className='card-back'; strip.appendChild(b); } }
    }
  }
  seats.forEach((h,i)=>{ const strip=box.querySelector(`.tbl-cards[data-seat="${i}"]`); if(strip) h.cards.forEach(cd=>strip.appendChild(cardEl(cd))); });
}

function renderMyHands(stage, hands, isMyTurn){
  // which hand is live (first still-playing)
  const liveIdx = hands.findIndex(h=>h.status==='playing');
  let html=`<div class="myhand">`;
  hands.forEach((h,i)=>{
    const t=total(h.cards);
    const pill = h.status==='bust'?`<span class="pill bust">Bust</span>`:h.status==='blackjack'?`<span class="pill bj">Blackjack</span>`:`<span class="pill">${t}</span>`;
    html+=`<div class="hand-block ${isMyTurn&&i===liveIdx?'active':''}">
      <div class="hand-head"><span>${hands.length>1?`Hand ${i+1}`:'Your hand'} · $${h.stake}</span><span>${h.status}</span></div>
      <div class="hand-cards" id="hc-${i}"></div>
      <div class="tot" style="margin-top:8px">Total ${pill}</div></div>`;
  });
  html+=`</div>`;
  // action buttons for the live hand
  if(isMyTurn && liveIdx>=0){
    const h=hands[liveIdx], t=total(h.cards), first=h.cards.length===2, canAfford=Number(player.balance)>=Number(h.stake);
    const pair = first && cardVal(h.cards[0])===cardVal(h.cards[1]);
    html+=`<div class="actions"><div class="action-grid">
      <button class="act hit" data-a="hit" ${t>=21?'disabled':''}>Hit</button>
      <button class="act stand" data-a="stand">Stand</button>
      <button class="act dbl" data-a="double" ${(!first||!canAfford)?'disabled':''}>Double</button>
      <button class="act split" data-a="split" ${(!pair||!canAfford)?'disabled':''}>Split</button>
    </div><p class="msg" id="amsg"></p></div>`;
  }
  stage.innerHTML=html;
  hands.forEach((h,i)=>{ const c=$('hc-'+i); if(c) h.cards.forEach(cd=>c.appendChild(cardEl(cd))); });
  if(isMyTurn && liveIdx>=0){
    stage.querySelectorAll('.act').forEach(b=>b.addEventListener('click',()=>doAction(b.dataset.a, hands[liveIdx].id)));
  }
}
function cardVal(c){ const r=c[0]; if(r==='A')return 11; if('TJQK'.includes(r))return 10; return parseInt(r,10); }

/* ── actions ── */
async function doAction(a, handId){
  if(busy)return; busy=true;
  document.querySelectorAll('.act').forEach(b=>b.disabled=true);
  const fn={hit:'player_hit',stand:'player_stand',double:'player_double',split:'player_split'}[a];
  const {error}=await sb.rpc(fn,{p_hand_id:handId});
  busy=false;
  if(error){ const m=$('amsg'); if(m){ m.className='msg err'; m.textContent=error.message||'Try again'; } repaintPlay(); return; }
  // realtime will repaint; nudge immediately
  repaintPlay();
}

/* ── stake pad ── */
function renderPad(stage){
  myStake = myStake || 0;
  padArmed = false;   // a fresh pad is always disarmed (button reads "Place bet")
  stage.innerHTML=`<div class="pad">
    <div class="pad-lab">Your bet</div>
    <div class="pad-amt" id="pad-amt"><span class="c">$</span><span id="pad-amt-n">${myStake}</span></div>
    <div class="pad-quick">
      <button data-q="10">+10</button><button data-q="25">+25</button><button data-q="50">+50</button><button data-q="max">Max</button>
    </div>
    <div class="pad-keys">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
      <button data-k="clear">C</button><button data-k="0">0</button><button data-k="back">⌫</button>
    </div>
    <button class="pad-place" id="pad-place">Place bet</button>
    <p class="msg" id="pad-msg"></p>
  </div>`;
  const amt=$('pad-amt-n');
  const setA=v=>{ myStake=Math.max(0,Math.min(Number(player.balance),v)); amt.textContent=myStake; };
  stage.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k;
    if(k==='clear')setA(0); else if(k==='back')setA(Math.floor(myStake/10)); else setA(myStake*10+Number(k));
  }));
  stage.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{
    const q=b.dataset.q; if(q==='max')setA(Number(player.balance)); else setA(myStake+Number(q));
  }));
  $('pad-place').addEventListener('click',placeBet);

  // Two-tap confirm: the first tap on Place bet "arms" it (turns green, label
  // changes to Tap to confirm); a second tap actually places the bet. Tapping
  // anywhere else in the pad disarms it, so the user must tap it twice again.
  // This guards against an accidental single tap placing a bet.
  const placeBtn=$('pad-place');
  const disarm=()=>{ if(!padArmed) return; padArmed=false; placeBtn.classList.remove('confirm'); placeBtn.textContent='Place bet'; placeBtn.blur(); };
  padDisarm=disarm;
  // Attach the outside-tap listener to the freshly-rendered pad (not #stage),
  // so it is replaced along with the pad on every repaint rather than stacking.
  const pad=stage.querySelector('.pad');
  pad.addEventListener('pointerdown',e=>{ if(!placeBtn.contains(e.target)) disarm(); });
}
let padArmed=false, padDisarm=null;
async function placeBet(){
  if(busy)return; const msg=$('pad-msg');
  // client fast-path: if betting has closed (window elapsed or all players in),
  // don't even attempt — repaint into the sitting-out state. The server's
  // place_blackjack_bet is the real authority and will also reject a late bet.
  if(betsClosedShown || (session && session.status!=='betting')){
    msg.className='msg err'; msg.textContent='Betting has closed for this round';
    repaintPlay(); return;
  }
  if(myStake<=0){ msg.className='msg err'; msg.textContent='Enter a bet first'; return; }
  // First tap arms the button; a second tap (below) confirms and places the bet.
  if(!padArmed){
    padArmed=true;
    const b=$('pad-place'); b.classList.add('confirm'); b.textContent='Tap to confirm';
    msg.className='msg'; msg.textContent='Tap again to confirm your bet';
    return;
  }
  padArmed=false;
  busy=true; $('pad-place').disabled=true;
  const {error}=await sb.rpc('place_blackjack_bet',{p_player_id:playerId,p_stake:myStake});
  busy=false;
  if(error){ $('pad-place').disabled=false; $('pad-place').classList.remove('confirm'); $('pad-place').textContent='Place bet'; msg.className='msg err'; msg.textContent=error.message||'Could not place bet'; return; }
  myStake=0; await resolveMySeat(); repaintPlay();
}

/* ── you're up takeover ── */
function fireTakeover(){
  const t=$('takeover'); t.classList.add('on');
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  setTimeout(()=>t.classList.remove('on'),1400);
}

/* ── My Bets / hands history — every round, with real rendered cards. Each round
   also shows the dealer's final hand so a win/loss reads in context. ── */
async function renderMyBets(){
  const box=$('mybets');
  // my hands + the dealer's hand for each round (dealer rows have is_dealer=true
  // and player_id null, so they're fetched separately and keyed by round).
  const [{data},{data:dealerRows}]=await Promise.all([
    sb.from('hands').select('*').eq('session_id',sessionId).eq('player_id',playerId)
      .order('round_number').order('hand_index'),
    sb.from('hands').select('round_number,cards,status').eq('session_id',sessionId).eq('is_dealer',true)
      .order('round_number'),
  ]);
  if(!data||!data.length){ box.innerHTML=`<div class="wait" style="margin-top:40px"><div class="wx">No hands played yet.</div></div>`; return; }
  const dealerByRound={}; (dealerRows||[]).forEach(d=>{ dealerByRound[d.round_number]=d; });
  // group by round so multi-hand (split) rounds read cleanly
  const byRound={}; data.forEach(h=>{ (byRound[h.round_number] ??= []).push(h); });
  box.innerHTML = Object.keys(byRound).map(Number).sort((a,b)=>b-a).map(rn=>{
    const hs=byRound[rn];
    const rows=hs.map((h,i)=>{
      const net=(Number(h.payout)||0)-Number(h.stake);
      const done=h.payout!=null;
      const cls=!done?'zero':net>0?'pos':net<0?'neg':'zero';
      const txt=!done?'—':net>0?`+$${net}`:net<0?`-$${Math.abs(net)}`:'Push';
      const label=hs.length>1?`Hand ${h.hand_index+1}`:'Hand';
      const t=total(h.cards);
      const statusTxt=h.status==='blackjack'?'Blackjack':h.status==='bust'?`Bust (${t})`:
        h.status==='won'?`Won (${t})`:h.status==='lost'?`Lost (${t})`:h.status==='push'?`Push (${t})`:`${t}`;
      return `<div class="mb-hand">
          <div class="mb-h-top"><span class="mb-h-lab">${label} · $${h.stake}</span><span class="br-r ${cls}">${txt}</span></div>
          <div class="mb-cards" data-cards="${esc(h.cards.join(','))}"></div>
          <div class="mb-status">${statusTxt}</div>
        </div>`;
    }).join('');
    // dealer's final hand for this round (only once cards exist)
    let dealerBlock='';
    const d=dealerByRound[rn];
    if(d && Array.isArray(d.cards) && d.cards.length){
      const dt=total(d.cards);
      const dStatus=d.status==='blackjack'?'Blackjack':d.status==='bust'?`Bust (${dt})`:`Stood on ${dt}`;
      dealerBlock=`<div class="mb-dealer">
          <div class="mb-h-top"><span class="mb-h-lab">Dealer</span><span class="mb-status">${dStatus}</span></div>
          <div class="mb-cards" data-cards="${esc(d.cards.join(','))}"></div>
        </div>`;
    }
    return `<div class="mb-round"><div class="mb-round-h">Round ${rn + 1}</div>${rows}${dealerBlock}</div>`;
  }).join('');
  // draw the real cards into each hand's card strip
  box.querySelectorAll('.mb-cards').forEach(strip=>{
    const codes=(strip.dataset.cards||'').split(',').filter(Boolean);
    codes.forEach(cd=>strip.appendChild(cardEl(cd,'sm')));
  });
}

  { t:'Goal', d:'Beat the dealer by getting closer to 21 than they do — without going over. Go over 21 and you "bust" and lose the hand.' },
  { t:'Card values', d:'Number cards are face value. J, Q, K are worth 10. An Ace is worth 11, or 1 if 11 would bust you — whichever helps most.' },
  { t:'Blackjack', d:'An Ace + any 10-value card on your first two cards is a "blackjack" — an automatic win that pays 3:2 (1.5×), unless the dealer also has one, which pushes.' },
  { t:'Hit', d:'Take another card. You can keep hitting as long as you\'re under 21. Hit when your total is low and you want to improve it.' },
  { t:'Stand', d:'Take no more cards and end your turn on your current total. Stand when you\'re happy with your hand and don\'t want to risk busting.' },
  { t:'Double', d:'Double your bet, take exactly one more card, then automatically stand. Only offered on your first two cards — a strong move when you\'re in a good spot (often on 9, 10 or 11).' },
  { t:'Split', d:'If your first two cards are a matching pair (e.g. two 8s), split them into two separate hands, each with its own bet and its own cards. Only offered on a first-two-card pair.' },
  { t:'Payouts', d:'A normal win pays even money (1:1). A blackjack pays 3:2 (1.5×). A "push" (tie with the dealer) returns your bet with no win or loss.' },
  { t:'Dealer rules', d:'After every player acts, the dealer reveals their hole card and must keep hitting until they reach at least 17, then stand. If the dealer busts, all remaining players win.' },

/* ── FINAL: Leaderboard + Big Moments (nav-level panes, mirrors the horse finale) ──
   Rendered into the dedicated #finale pane. The fixed .fin-tabs bar (wired once,
   below) switches between the Leaderboard and Big Moments sub-blocks; the top
   seg's My Hands button routes to the separate #mybets pane. The Leaderboard tab
   carries a placement hero + a bottom→top row reveal, matching the horse finale
   (kept in the blackjack transparent idiom). */
let finTab='board';
let _finaleBuilt=false;
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
/* headline/medal/sub copy for the player's own placement. Reads ./data/phrases.json
   (PHRASES.placement) when present so copy is editable without touching code —
   same keys/shape as the horse file, so a shared phrases.json works for both.
   Values may be a single string or an array of variants (one is picked at
   random). Fallbacks below are blackjack-appropriate (no racing terms). */
function placementCopy(rank,total){
  const P=(PHRASES&&PHRASES.placement)||{};
  const pk=v=>Array.isArray(v)?(v.length?v[(Math.random()*v.length)|0]:''):(v!=null?v:'');
  const d=(k,fb)=>P[k]||fb;
  const norm=o=>({ medal:pk(o.medal), headline:pk(o.headline), sub:pk(o.sub) });
  if(rank===1){ const o=d('first',{medal:'🏆',headline:'Champion!',subMany:'Top of the table.',subSolo:'Last one standing.'});
    return { medal:pk(o.medal), headline:pk(o.headline), sub:pk(total>1?o.subMany:o.subSolo) }; }
  if(rank===2) return norm(d('second',{medal:'🥈',headline:'So, so close',sub:'Pipped right at the end.'}));
  if(rank===3) return norm(d('third',{medal:'🥉',headline:'On the podium',sub:'A spot on the winners’ list.'}));
  if(rank===total) return norm(d('last',{medal:'🥄',headline:'Wooden spoon',sub:'Someone had to prop up the table.'}));
  const span=total-1-3, within=span>0?(rank-4)/span:0;
  if(within<=0.34) return norm(d('midTop',{medal:'👏',headline:'Top of the pack',sub:'Just missed the medals.'}));
  if(within<=0.67) return norm(d('midMid',{medal:'🙂',headline:'Mid-table finish',sub:'Right in the thick of it.'}));
  return norm(d('midBack',{medal:'😅',headline:'Down the table',sub:'You dodged the wooden spoon.'}));
}
async function renderFinale(){
  const box=$('finale'); if(!box) return;
  // The finale is static once the game is over. applyState re-runs on every
  // realtime poll, so only build (and run the reveal) once — otherwise the board
  // re-animates on every tick. A tab switch re-runs syncFinTabs, not a rebuild.
  if(_finaleBuilt){ syncFinTabs(); return; }
  const startBal=Number(cfg.startingBalance)||200;
  const {data:players}=await sb.from('players').select('id,display_name,balance,joined_at').eq('session_id',sessionId);
  // Sort by balance desc; tie-break by joined_at asc (earlier joiner ranks higher)
  // so this ordering is deterministic and IDENTICAL to the host's final standings.
  const roster=(players||[]).slice().sort((a,b)=>
    (Number(b.balance)||0)-(Number(a.balance)||0)
    || (new Date(a.joined_at)-new Date(b.joined_at)));
  const total=roster.length;
  const myIdx=roster.findIndex(p=>p.id===playerId);
  const rank=myIdx>=0?myIdx+1:total;
  const myBal=myIdx>=0?(Number(roster[myIdx].balance)||0):(Number(player.balance)||0);
  setBalance(myBal);
  const moments=await computeBigMoments(startBal);

  // placement hero copy for me
  const place=placementCopy(rank,total);
  const net=myBal-startBal;
  const netCls=net>0?'up':net<0?'down':'flat';
  const netTxt=net>0?`▲ Up $${Math.abs(net).toLocaleString()} on the night`
             :net<0?`▼ Down $${Math.abs(net).toLocaleString()} on the night`
             :'Finished level — broke exactly even';
  const money=v=>Math.round(Number(v)||0).toLocaleString();

  box.innerHTML=`
    <div class="fin-hero${rank===1?' gold':''}" id="fin-hero">
      <div class="eyebrow">That’s the table</div>
      <div class="medal">${place.medal}</div>
      <div class="place">${ordinal(rank)}</div>
      <div class="of">${total>1?('of '+total+' players'):''}</div>
      <div class="headline">${esc(place.headline)}</div>
      <div class="sub">${esc(place.sub)}</div>
      <div class="net ${netCls}">${netTxt}</div>
    </div>
    <div id="fin-board" class="${finTab==='board'?'':'hidden'}">
      ${roster.map((p,i)=>{
        const r=i+1, me=p.id===playerId, medal=['🥇','🥈','🥉'][i]||'';
        return `<div class="lb${r===1?' gold':''}${me?' me':''}">
          <span class="rk">${r}</span>${r<=3?`<span class="md">${medal}</span>`:''}
          <span class="nm">${esc(p.display_name)}${me?'<span class="tag">You</span>':''}</span>
          <span class="bl">$${money(p.balance)}</span></div>`;
      }).join('')}
    </div>
    <div id="fin-moments" class="${finTab==='moments'?'':'hidden'}">
      ${moments.length?moments.map(m=>`
        <div class="mo-tile ${m.net>=0?'win':'loss'}">
          <div class="mo-body"><div class="mo-who">${esc(m.who)}</div><div class="mo-detail">${esc(m.detail)}</div></div>
          <div class="mo-amt">${m.net>=0?'+':'−'}$${Math.abs(m.net).toLocaleString()}</div></div>`).join('')
        :'<div class="wait" style="margin-top:30px"><div class="wx">No standout hands this session.</div></div>'}
    </div>`;
  syncFinTabs();
  revealBoardBottomUp();
  _finaleBuilt = true;
}
/* reveal leaderboard rows bottom→top for a bit of suspense (mirrors horse) */
let _boardTimers=[];
function revealBoardBottomUp(){
  _boardTimers.forEach(t=>clearTimeout(t)); _boardTimers=[];
  if(finTab!=='board') return;
  const rows=Array.from(document.querySelectorAll('#fin-board .lb'));
  const last=rows.length-1, STEP=280;
  rows.forEach((row,domIdx)=>{
    const order=last-domIdx;
    _boardTimers.push(setTimeout(()=>row.classList.add('revealed'), 200+order*STEP));
  });
}
/* switch finale sub-view; called by the fixed nav-level fin-tabs bar */
function setFinalTab(tab){
  finTab=tab;
  // if we were showing My Hands, coming back to a board/moments tab returns to
  // the finale pane.
  if(currentTab!=='finale') setTab('finale');
  else { syncFinTabs(); if(tab==='board') revealBoardBottomUp(); }
}
function syncFinTabs(){
  const bar=$('fin-tabs'); if(!bar) return;
  // no nav-tab underlined while the My Hands pane is up
  const onHands = currentTab==='bets';
  bar.classList.toggle('noselect', onHands);
  bar.querySelectorAll('.fin-tab').forEach(t=>t.classList.toggle('active', !onHands && t.dataset.ft===finTab));
  // the placement hero belongs to the Leaderboard tab only
  $('fin-hero') && $('fin-hero').classList.toggle('hidden', finTab!=='board');
  $('fin-board') && $('fin-board').classList.toggle('hidden', finTab!=='board');
  $('fin-moments') && $('fin-moments').classList.toggle('hidden', finTab!=='moments');
}
/* wire the fixed fin-tabs bar once at load */
document.querySelectorAll('#fin-tabs .fin-tab').forEach(t=>t.addEventListener('click',()=>setFinalTab(t.dataset.ft)));
/* biggest single-hand swings across the whole session, any player */
async function computeBigMoments(startBal){
  const [{data:hands},{data:players}]=await Promise.all([
    sb.from('hands').select('player_id,round_number,hand_index,cards,stake,payout,status,is_dealer').eq('session_id',sessionId),
    sb.from('players').select('id,display_name').eq('session_id',sessionId),
  ]);
  const names={}; (players||[]).forEach(p=>names[p.id]=p.display_name);
  const rows=(hands||[]).filter(h=>!h.is_dealer && h.payout!=null).map(h=>{
    const net=(Number(h.payout)||0)-Number(h.stake);
    const t=total(h.cards||[]);
    const detail=`Round ${h.round_number + 1} · ${h.status==='blackjack'?'Blackjack':h.status==='bust'?`Bust on ${t}`:h.status==='push'?'Push':`${h.status} on ${t}`}`;
    return { who:names[h.player_id]||'Player', detail, net };
  });
  rows.sort((a,b)=>Math.abs(b.net)-Math.abs(a.net));
  return rows.filter(r=>r.net!==0).slice(0,15);
}


/* ── views / tabs ──
   Surfaces share the home screen, chosen by `currentTab`:
     'play'   → #stage  (RULES in lobby · PAD/HAND while live)
     'table'  → #table  (dealer hand + every seat, live rounds only)
     'bets'   → #mybets (My Hands history — opened from the top-right button)
     'finale' → #finale (Leaderboard / Big Moments when the game is finished)
   The bottom tab-bar is rebuilt per phase; the My Hands button lives top-right
   (mirrors the horse page's My Bets, replacing Leave once the table starts).
   In the finale, a fixed nav-level fin-tabs bar drives Leaderboard / Big Moments,
   and the My Hands seg toggles the #mybets pane — matching the horse finale. */
function setTab(t){
  currentTab=t;
  $('stage').classList.toggle('hidden', t!=='play');
  $('table').classList.toggle('hidden', t!=='table');
  $('mybets').classList.toggle('hidden', t!=='bets');
  $('finale').classList.toggle('hidden', t!=='finale');
  // the nav-level fin-tabs bar shows only on the finale board/moments views, not
  // while My Hands is up (that's driven by the top seg instead).
  const finished = session && session.status==='finished';
  $('fin-tabs').classList.toggle('hidden', !(finished && t==='finale'));
  renderTabBar(); renderNavCtrl();
  if(t==='play') repaintPlay();
  else if(t==='table') renderTable();
  else if(t==='finale') renderFinale();
  else renderMyBets();
}

/* bottom tab-bar: RULES only in the lobby; HAND + TABLE while a round is live;
   nothing during the finale (the finale carries its own Leaderboard / Big Moments). */
function renderTabBar(){
  const bar=$('tab-bar'); if(!bar) return;
  const status=session&&session.status;
  if(status==='lobby'){
    bar.classList.remove('hidden');
    bar.innerHTML=`<div class="tab on" data-tab="play">Rules</div>`;
  } else if(status==='finished'){
    bar.classList.add('hidden'); bar.innerHTML='';
  } else {
    bar.classList.remove('hidden');
    const handOn = currentTab==='play' ? ' on' : '';
    const tblOn  = currentTab==='table' ? ' on' : '';
    bar.innerHTML=`<div class="tab${handOn}" data-tab="play">Hand</div>`+
                  `<div class="tab${tblOn}" data-tab="table">Table</div>`;
  }
  bar.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setTab(t.dataset.tab)));
}

/* top-right control: Leave in the lobby; a My Hands button (which replaces Leave)
   the moment the table starts, matching the horse page's My Bets placement. */
function renderNavCtrl(){
  const host=$('nav-ctrl'); if(!host) return;
  const status=session&&session.status;
  const wireMyHands=()=>{
    $('btn-myhands').addEventListener('click',()=>{
      if(currentTab==='bets') setTab(returnTab);
      else { returnTab = currentTab==='play'||currentTab==='table' ? currentTab : 'play'; setTab('bets'); }
    });
  };
  if(status==='lobby'||!status){
    host.innerHTML=`<button class="leave-ctrl" id="leave-btn">Leave</button>`;
    wireLeave($('leave-btn'));
  } else if(status==='finished'){
    // finale: My Hands sits alongside Leave (mirrors the horse finale's My Bets + Leave).
    // The seg toggles between the finale panes and the #mybets history; returning
    // from My Hands lands back on the finale (Leaderboard / Big Moments).
    const active = currentTab==='bets' ? ' active' : '';
    host.innerHTML=`<span class="seg" style="margin-right:8px"><button id="btn-myhands" class="${active.trim()}">My Hands</button></span>`+
                   `<button class="leave-ctrl" id="leave-btn">Leave</button>`;
    $('btn-myhands').addEventListener('click',()=>{
      setTab(currentTab==='bets' ? 'finale' : 'bets');
    });
    wireLeave($('leave-btn'));
  } else {
    const active = currentTab==='bets' ? ' active' : '';
    host.innerHTML=`<span class="seg"><button id="btn-myhands" class="${active.trim()}">My Hands</button></span>`;
    wireMyHands();
  }
}
let returnTab='play';

/* ── helpers / gates / leave ── */
let _balRaf=null, _balShown=null;
function fmtMoney(v){ return '$'+Math.round(Number(v)||0).toLocaleString(); }
/* Set the banner balance. On a change, roll the number to the new value tinted
   green (up) / red (down), pop on landing, then fade the tint back to white.
   First set and no-change are instant. Honours prefers-reduced-motion. */
function setBalance(v){
  const target=Math.round(Number(v)||0);
  player.balance=v;
  const el=$('nav-balance'); if(!el) return;
  const reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const from=_balShown==null?target:_balShown;   // first paint: no animation

  if(from===target || _balShown==null || reduce){
    if(_balRaf){ cancelAnimationFrame(_balRaf); _balRaf=null; }
    el.classList.remove('bal-up','bal-down','bal-pop');
    el.textContent=fmtMoney(target); _balShown=target; return;
  }

  const up=target>from;
  if(_balRaf){ cancelAnimationFrame(_balRaf); _balRaf=null; }
  el.classList.remove('bal-pop');
  el.classList.toggle('bal-up',up);
  el.classList.toggle('bal-down',!up);

  // snappy roll: ~500ms, nudged up a touch for bigger swings, capped ~750ms
  const dur=Math.min(750, 380+Math.min(370, Math.abs(target-from)*1.2));
  const t0=performance.now();
  const ease=t=>1-Math.pow(1-t,3);   // easeOutCubic
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur);
    const val=Math.round(from+(target-from)*ease(p));
    el.textContent=fmtMoney(val);
    if(p<1){ _balRaf=requestAnimationFrame(step); }
    else {
      _balRaf=null; _balShown=target; el.textContent=fmtMoney(target);
      // pop on landing, then let the colour fade back to white
      el.classList.add('bal-pop');
      el.addEventListener('animationend',()=>el.classList.remove('bal-pop'),{once:true});
      el.classList.remove('bal-up','bal-down');   // CSS color transition eases back
    }
  };
  _balShown=from;
  _balRaf=requestAnimationFrame(step);
}
function showGate(w){ ['gate-loading','gate-error','gate-closed'].forEach(id=>$(id).classList.toggle('hidden',id!==w)); $('home').classList.add('hidden'); }
function showHome(){ ['gate-loading','gate-error','gate-closed'].forEach(id=>$(id).classList.add('hidden')); $('home').classList.remove('hidden'); }
function showErr(t,x){ showGate('gate-error'); $('err-title').textContent=t; $('err-text').textContent=x; }
function showClosed(){ showGate('gate-closed'); }

let armed=false,armT=null;
function wireLeave(b){
  if(!b) return; armed=false;
  b.addEventListener('click',async()=>{
    if(!armed){ armed=true; b.classList.add('confirm'); b.textContent='Tap to leave'; armT=setTimeout(()=>{armed=false;b.classList.remove('confirm');b.textContent='Leave';},4000); return; }
    clearTimeout(armT); b.disabled=true; b.textContent='Leaving…';
    try{ await sb.rpc('leave_session',{p_player_id:playerId}); }catch(e){}
    if(channel){ try{ sb.removeChannel(channel); }catch(e){} }
    location.href='../../index.html';
  });
}

boot();
